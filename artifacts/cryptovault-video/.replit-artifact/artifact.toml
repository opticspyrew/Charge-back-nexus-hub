kind = "video"
previewPath = "/cryptovault-video/"
title = "CryptoVault Overview Video"
version = "1.0.0"
id = "artifacts/cryptovault-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/cryptovault-video/" ]
localPort = 20300

[services.development]
run = "pnpm --filter @workspace/cryptovault-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cryptovault-video", "run", "build" ]
publicDir = "artifacts/cryptovault-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20300"
BASE_PATH = "/cryptovault-video/"
